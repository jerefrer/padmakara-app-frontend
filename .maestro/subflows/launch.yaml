# Shared start: a fresh install of the dev build, connected to the local Metro server.
# Not a test on its own: Maestro only runs the flows at the top of .maestro/.
appId: org.padmakara.pt
---
- launchApp:
    clearState: true
# The dev launcher lists the Metro server it finds; opening it by a link instead
# would raise an iOS "Open in Padmakara?" confirmation.
# On iOS the server is listed as localhost; the Android emulator reaches the host as 10.0.2.2.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "http://localhost:8081"
          timeout: 30000
      - tapOn: "http://localhost:8081"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "http://10.0.2.2:8081"
          timeout: 30000
      - tapOn: "http://10.0.2.2:8081"
# expo-dev-menu introduces itself on the first launch after a fresh install.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 120000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Reload"
    timeout: 10000
# The dev menu then stays open: iOS shows a half sheet (tap the dimmed app above it to
# close it), Android a full sheet that the back key closes.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,15%"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- extendedWaitUntil:
    notVisible: "Reload"
    timeout: 10000
